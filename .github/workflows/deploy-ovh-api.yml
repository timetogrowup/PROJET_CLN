name: Deploy OVH contact API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-contact-api
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate PHP syntax
        run: php -l contact.php
      - name: Verify reviewed SFTP identity is available
        run: |
          if [ ! -s deploy/ovh_known_hosts ]; then
            echo "Server key discovery only. Verify identity with OVH before pinning this key."
            ssh-keyscan -T 15 -t ed25519,rsa ftp.cluster129.hosting.ovh.net > /tmp/ovh-host-keys
            cat /tmp/ovh-host-keys
            ssh-keygen -lf /tmp/ovh-host-keys -E sha256
            echo "::error::Missing reviewed deploy/ovh_known_hosts. No password transmitted."
            exit 1
          fi
      - name: Install distribution SFTP client library
        run: sudo apt-get update -qq && sudo apt-get install -y python3-paramiko
      - name: Build pinned PHPMailer dependency
        run: composer install --working-dir=deploy/mail --no-dev --no-interaction --prefer-dist --no-scripts --no-plugins
      - name: Validate mailer PHP syntax
        run: find deploy/mail/vendor -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Deploy contact API and private SMTP configuration
        env:
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          CLN_SMTP_PASSWORD: ${{ secrets.CLN_SMTP_PASSWORD }}
        run: /usr/bin/python3 scripts/deploy_ovh_api.py
